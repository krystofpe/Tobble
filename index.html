function invitePanel(){
  const link = h('input', { class:'field link-field', type:'text', readonly: true, value: location.href, 'aria-label':'Invite link' });
  const copyBtn = h('button', { class:'ghost', type:'button' });
  const idle = () => copyBtn.replaceChildren(icon('copy', 18), 'Copy link');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(location.href); copyBtn.replaceChildren(icon('check', 18, 2.4), 'Copied!'); }
    catch { link.focus(); link.select(); copyBtn.textContent = 'Selected, now copy'; }
    setTimeout(idle, 1600);
  });
  idle();
  const shareBtn = h('button', { class:'ghost', type:'button' }, icon('share', 18), 'Send invite');
  shareBtn.addEventListener('click', async () => {
    const data = { title:'Tobble', text:'Come and play Tobble with me: find the one picture two cards share.', url: location.href };
    if (navigator.share){
      try { await navigator.share(data); return; } catch (e){ if (e && e.name === 'AbortError') return; }
    }
    copyBtn.click();
  });
  return h('section', { class:'panel', style:'margin-top:22px;display:flex;flex-direction:column;gap:12px' },
    h('h2', { class:'label', text:'Invite friends' }),
    h('p', { class:'small soft', text:'Send this link once. Everyone who opens it joins this table and its scoreboard.' }),
    link, h('div', { class:'pair-btns' }, copyBtn, shareBtn));
}
function lobbyView(){
  const rows = summarize(), board = leaderboard(rows);
  const mine = rows.filter(r => r.status === 'todo' || r.status === 'playing').reverse();
  const waiting = rows.filter(r => r.status === 'waiting').reverse();
  const done = rows.filter(r => r.status === 'done').reverse();
  const title = !state.loaded ? 'Getting the table ready…' : mine.length === 1 ? 'One duel is waiting for you'
    : mine.length ? `${mine.length} duels are waiting for you` : 'Challenge your friends';
  const newBtn = h('button', { class:'btn primary', type:'button', disabled: !state.loaded }, icon('plus'), 'Deal a new duel');
  newBtn.addEventListener('click', () => newDuel(newBtn));
  const section = (label, list, empty) => h('section', { class:'section' }, h('h2', { class:'label', text: label }),
    list.length ? h('ul', { class:'rows' }, list.map(duelItem)) : h('p', { class:'empty', text: empty }));
  return h('div', { class:'col table-col' },
    h('div', { class:'bar' },
      !isDemo() && h('button', { class:'icon-btn', type:'button', 'aria-label':'Leave the table', onclick: () => { location.hash = ''; } }, icon('back')),
      h('h1', { class:'ell', text:'The table' }), meChip()),
    isDemo() && setupGuide(),
    state.error && errorNote(),
    h('div', { style:'margin-top:22px;display:flex;flex-direction:column;gap:8px' },
      h('h2', { class:'status-title', text: title }),
      h('p', { class:'soft', text:`${PAIRS} pairs of cards. Find the one picture each pair shares, as fast as you can. Your friends get exactly the same cards, whenever they have time.` })),
    !isDemo() && invitePanel(),
    !state.loaded
      ? h('p', { class:'empty', style:'margin-top:24px', text: state.slow ? 'Still trying to reach the scoreboard…' : 'Loading duels…' })
      : [section('Your turn', mine, 'Nothing is waiting for you. Deal a new duel and your friends will find it here.'),
         waiting.length ? section('Waiting for friends', waiting, '') : null,
         section('Finished', done.slice(0, 20), 'Finished duels show up here with everyone’s times.'),
         boardSection(board)],
    h('p', { class:'small muted', style:'margin-top:20px;text-align:center' },
      h('button', { class:'link', type:'button', onclick: howToPlay }, 'How to play'), ' · ', soundLink()),
    h('div', { class:'dock' }, newBtn));
}
async function newDuel(btn){
  btn.disabled = true;
  const duel = { id: randomId(12), seed: Math.floor(Math.random() * 2147483647), createdAt: Date.now(), createdBy: state.player.name };
  try {
    await state.backend.createDuel(state.room, duel);
    state.created.push(cleanDuel(duel));
    if (!state.duels.some(d => d.id === duel.id)) state.duels = [...state.duels, cleanDuel(duel)];
    openDuel(duel.id);
  } catch (e){
    btn.disabled = false;
    state.error = e && e.code ? e : { code:'unknown' };
    render();
  }
}

/* Results */
function fanArt(stickers){
  const img = (id, x, y, s, rot) => `<image href="${symbolSrc(id)}" x="${x}" y="${y}" width="${s}" height="${s}" transform="rotate(${rot} ${x + s / 2} ${y + s / 2})"/>`;
  const card = (cx, cy, rot, inner) => `<g transform="rotate(${rot} ${cx} ${cy})"><circle class="h-edge" cx="${cx}" cy="${cy + 5}" r="75" filter="url(#fan-shadow)"/>` +
    `<circle class="h-card" cx="${cx}" cy="${cy}" r="75"/><circle class="h-stitch" cx="${cx}" cy="${cy}" r="67"/>${inner}</g>`;
  const sticker = ([token, them], cx, cy, r, rot) => `<g transform="rotate(${rot} ${cx} ${cy})"><circle class="h-tok ${them ? 'them' : 'you'}" cx="${cx}" cy="${cy}" r="${r + 2}" filter="url(#fan-shadow)"/>` +
    img(token, cx - r * 0.7, cy - r * 0.7, r * 1.4, 0) + '</g>';
  const tokens = stickers.length > 1
    ? sticker(stickers[0], 94, 166, 30, -8) + sticker(stickers[1], 252, 166, 30, 8)
    : stickers.length ? sticker(stickers[0], 251, 169, 33, 8) : '';
  return art(`<svg class="fan bleed" viewBox="-24 4 390 214" aria-hidden="true" focusable="false">
    <defs><filter id="fan-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#08140F" flood-opacity=".45"/></filter></defs>
    ${card(123, 105, -16, img('leaf', 76, 64, 44, -20) + img('moon', 92, 114, 40, 0))}
    ${card(219, 105, 14, img('candle', 224, 60, 42, 10) + img('key', 220, 112, 42, 0))}
    ${card(171, 119, -3, img('star', 147, 62, 48, -8) + img('heart', 120, 114, 44, -16) + img('daisy', 176, 116, 46, 12))}
    ${tokens}</svg>`);
}
function resultView(){
  const shown = state.shown, me = state.player.key;
  const row = shown && summarize().find(r => r.duel.id === shown.duelId);
  if (!row || !row.mine || !isDone(row.mine)){ state.screen = 'lobby'; return lobbyView(); }
  const mine = row.mine, others = otherPlayers(), unsaved = isUnsaved(row.duel.id);
  const iWon = row.winners.includes(me), tie = row.winners.length > 1;
  const winner = row.done.find(r => row.winners.includes(r.key) && r.key !== me) || null;
  const rival = row.othersDone.filter(r => !r.dnf).sort((a, b) => a.timeMs - b.timeMs)[0] || null;
  let headline, line;
  if (mine.dnf){ headline = 'Out of time'; line = 'This duel wasn’t finished within 10 minutes.'; }
  else if (!row.othersDone.length){
    headline = 'Done!';
    line = `${others.length ? listNames(others) : 'Your friends'} will find this duel waiting. Your time stays hidden until they’ve played it.`;
  }
  else if (iWon && tie){ headline = 'A perfect tie!'; line = `${fmt(mine.timeMs)} each. Two cocoas, then.`; }
  else if (iWon){
    headline = 'You win!';
    line = !rival ? `${listNames(row.othersDone.map(r => r.name))} ran out of time. Cocoa’s on them.`
      : row.othersDone.length === 1 ? `${fmt(mine.timeMs)} to ${fmt(rival.timeMs)}. ${rival.name} owes you a cocoa.`
      : `Fastest of ${row.done.length}. Everyone else owes you a cocoa.`;
  }
  else if (winner){ headline = `${winner.name} wins!`; line = `${fmt(winner.timeMs)} to ${fmt(mine.timeMs)}. You owe ${winner.name} a cocoa.`; }
  else { headline = 'Done!'; line = ''; }
  const stickers = mine.dnf && !winner ? []
    : !row.othersDone.length || (iWon && !tie) ? [[myToken(), false]]
    : iWon && tie ? [[myToken(), false], [tokenOf(winner ? winner.key : row.othersDone[0].key), true]]
    : winner ? [[tokenOf(winner.key), true]] : [];

  const timed = row.done.filter(r => !r.dnf), best = timed.length ? Math.min(...timed.map(r => r.timeMs)) : 0;
  const bars = h('ul', { class:'bars', 'aria-label':'Times' },
    row.done.map(r => {
      const you = r.key === me, pct = r.dnf ? 0 : Math.max(8, Math.round(best / r.timeMs * 100));
      return h('li', { class: you ? 'you' : 'them' }, tokenEl(tokenOf(r.key), !you),
        h('span', { class:'grow' },
          h('span', { class:'who' }, h('span', { class:'ell', text: you ? 'You' : r.name }),
            row.winners.includes(r.key) && h('span', { class:'winner' + (you ? '' : ' them'), text: tie ? 'Tie' : 'Winner' })),
          h('span', { class:'track' }, h('span', { class:'fill', style:`width:${pct}%` }))),
        h('span', { class:'t' + (r.dnf ? ' out' : '') + (you ? ' bigtime' : ''), text: r.dnf ? 'out of time' : fmt(r.timeMs) }));
    }),
    !row.othersDone.length && h('li', { class:'waiting' }, h('span', { class:'wait-disc', 'aria-hidden':'true' }, h('i'), h('i'), h('i')),
      h('span', { class:'grow' },
        h('span', { class:'who' }, h('span', { class:'ell', text: others.length ? `Waiting for ${listNames(others)}…` : 'Waiting for your friends…' })),
        h('span', { class:'small muted', text: others.length ? 'Their times show up here by themselves.' : 'Send them the invite link from the table.' }))));
  const fastest = mine.splits.length ? Math.min(...mine.splits) : null;

  const again = h('button', { class:'btn primary', type:'button' }, icon('plus'), 'Deal a new duel');
  again.addEventListener('click', () => newDuel(again));
  const retry = h('button', { class:'link', type:'button' }, 'Try again');
  retry.addEventListener('click', () => {
    state.refused.delete(row.duel.id);
    shown.failed = false; shown.saving = true; render();
    resend(row.duel.id).then(() => { shown.saving = false; }, () => { shown.saving = false; shown.failed = true; })
      .then(() => { if (state.screen === 'result' && state.shown === shown) render(); });
  });
  return h('div', { class:'col result' },
    h('span', { class:'caption', style:'margin-top:14px', text:`Duel #${row.no} · ${mine.dnf ? 'out of time' : `all ${PAIRS} pairs`}` }),
    fanArt(stickers),
    h('div', { class:'head' }, h('h1', { text: headline }), line && h('p', { class:'soft', text: line })),
    bars,
    h('div', { class:'tiles' },
      h('div', { class:'tile' }, h('span', { class:'caption', text:'Fastest pair' }), h('b', { text: fastest == null ? '—' : `${(fastest / 1000).toFixed(1)} s` })),
      h('div', { class:'tile' }, h('span', { class:'caption', text:'Wrong taps' }),
        h('b', { text: mine.mistakes ? `${mine.mistakes} (+${mine.mistakes * PENALTY_MS / 1000} s)` : 'None' }))),
    unsaved && shown.failed && h('p', { class:'save-note bad' }, 'Your result is not saved to the scoreboard yet. ', retry),
    unsaved && shown.saving && h('p', { class:'save-note', text:'Saving your result…' }),
    row.othersDone.length ? h('section', { class:'section' }, h('h2', { class:'label', text:'Pair by pair' }),
      h('div', { class:'panel scroll-x', style:'padding:10px 14px' }, roundsTable(row))) : null,
    h('div', { class:'btn-row' }, again,
      h('button', { class:'btn secondary slim', type:'button', onclick: () => { state.screen = 'lobby'; render(); window.scrollTo(0, 0); } }, 'Back to the table')));
}

/* ─────────────────────────── 8. PLAYING A DUEL ───────────────────────────
   Your card is card k, the pile is card k + 1. Find their one shared picture and the pile card
   slides down to become your card while the next pile card is dealt. */
const HIT_MS = 300;   // how long a found picture stays ringed before the cards move on
function openDuel(id){
  const duel = state.duels.find(d => d.id === id);
  if (!duel || !state.player) return;
  const me = state.player, resultId = duel.id + '_' + me.key;
  const stored = state.results.find(r => r.id === resultId);
  if ((stored && isDone(stored)) || state.local.final[duel.id]){ state.screen = 'lobby'; render(); return; }
  const row = summarize().find(r => r.duel.id === id), no = row.no;
  const cards = buildDuel(duel.seed);
  const saved = state.local.prog[duel.id] || null;
  const p = {
    idx: saved ? Math.min(saved.idx, PAIRS - 1) : 0, mistakes: saved ? saved.mistakes : 0, splits: saved ? saved.splits.slice() : [],
    startedAt: (saved && saved.startedAt) || (stored && stored.startedAt) || null,
    locked: true, over: false, raf: 0, lastMiss: 0, timers: [], countdown: 0,
  };
  const later = (fn, ms) => { p.timers.push(setTimeout(fn, ms)); };
  const start = () => ({ id: resultId, duelId: duel.id, key: me.key, name: me.name, startedAt: p.startedAt, token: myToken() });
  const persist = () => { state.local.prog[duel.id] = { startedAt: p.startedAt, idx: p.idx, mistakes: p.mistakes, splits: p.splits }; saveLocal(); };
  const warn = e => { e.preventDefault(); e.returnValue = ''; };
  const compact = window.matchMedia('(max-height: 799px)');

  // top bar
  const leftNum = h('span');
  const leftChip = h('span', { class:'left-chip' }, icon('pile', 18, 2), leftNum);
  const title = h('span', { class:'play-title', text:`Duel #${no}` });
  const mid = h('div', { class:'play-mid' }, title);
  // who already played this duel (their times stay hidden)
  const friends = row.othersDone;
  const friendsRow = friends.length
    ? h('div', { class:'friends prow' }, h('span', { class:'tokens-stack' }, friends.slice(0, 3).map(r => tokenEl(tokenOf(r.key), true))),
        h('span', { class:'grow' }, h('span', { class:'title' }, h('span', { class:'ell', text: friends.length === 1 ? friends[0].name : `${friends.length} friends` })),
          h('span', { class:'sub', text:'Already played · hidden until you finish' })),
        h('span', { class:'pill them', 'aria-label':'Their time is hidden' }, h('b', { text:'?' }), h('small', { text:'sec' })))
    : h('div', { class:'friends prow dashed' }, h('span', { class:'wait-disc', 'aria-hidden':'true' }, h('i'), h('i'), h('i')),
        h('span', { class:'grow' }, h('span', { class:'title soft', text:'First to play' }), h('span', { class:'sub', text:'Your time is the one to beat' })));
  // the cards
  const pileSlot = h('div', { class:'slot pile-slot' }), youSlot = h('div', { class:'slot you-slot' });
  const toast = h('span', { class:'toast hint', text:'Find the one picture both cards share' });
  // your row, with the clock
  const clock = h('b', { class:'clock', text:'0.0' });
  const pen = h('span', { class:'pen', 'aria-hidden':'true', text:`+${PENALTY_MS / 1000} s` });
  const clockPill = h('span', { class:'pill you', title:'Your time' }, clock, h('small', { text:'sec' }), pen);
  const misses = h('span', { class:'misses' }), missWord = h('span');
  const meRight = h('span', { style:'display:flex' });
  const overlay = h('div', { class:'overlay' });
  const root = h('div', { class:'play', 'data-pair': String(p.idx), 'data-ready':'0' },
    h('header', { class:'bar play-bar' },
      h('button', { class:'icon-btn', type:'button', 'aria-label':'Leave the duel', onclick: askLeave }, icon('x', 20, 2.4)), mid, leftChip),
    friendsRow,
    h('main', { class:'stage' }, h('span', { class:'caption', text:'The pile' }), pileSlot,
      h('div', { class:'toastline', role:'status', 'aria-live':'polite' }, toast), youSlot),
    h('div', { class:'me prow' }, tokenEl(myToken()),
      h('span', { class:'grow' }, h('span', { class:'title', text:'You' }), h('span', { class:'sub' }, 'Your card · ', misses, missWord)), meRight),
    overlay);
  if (closeOpenSheet) closeOpenSheet();
  state.screen = 'play';
  state.stopPlay = cleanup;
  $app.replaceChildren(root);
  window.scrollTo(0, 0);

  function placeClock(){
    if (compact.matches) mid.replaceChildren(clockPill);
    else { mid.replaceChildren(title); meRight.replaceChildren(clockPill); }
  }
  function paintLeft(){
    leftNum.textContent = `${PAIRS - p.idx} left`;
    leftChip.setAttribute('aria-label', `${PAIRS - p.idx} of ${PAIRS} pairs left`);
  }
  function paintMisses(){
    misses.textContent = String(p.mistakes);
    missWord.textContent = p.mistakes === 1 ? ' wrong tap' : ' wrong taps';
  }
  function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function setToast(kind, text){ toast.className = 'toast ' + kind; toast.textContent = text; restart(toast, 'pop'); }
  function showClock(){
    if (p.startedAt != null) clock.textContent = ((Date.now() - p.startedAt + p.mistakes * PENALTY_MS) / 1000).toFixed(1);
  }
  function cardEl(card, where){
    const el = h('div', { class:`card ${where}${card ? '' : ' blank'}`, role:'group', 'aria-label': where === 'pile' ? 'The pile card' : 'Your card' });
    const pct = v => v.toFixed(2) + '%';
    for (const it of card ? card.items : []){
      const btn = h('button', { class:'sym', type:'button', 'aria-label': LABEL[it.id], 'data-id': it.id,
        style:`left:${pct(50 + (it.x - it.size / 2) * 100)};top:${pct(50 + (it.y - it.size / 2) * 100)};` +
              `width:${pct(it.size * 100)};height:${pct(it.size * 100)};--tilt:${it.tilt}deg` },
        h('img', { src: symbolSrc(it.id), alt:'', draggable:'false' }));
      // React on press, not release, so a tap counts the moment the finger lands.
      btn.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button === 0) pick(it.id, btn, where); });
      btn.addEventListener('click', e => { if (e.detail === 0) pick(it.id, btn, where); });   // keyboard
      el.append(btn);
    }
    return el;
  }
  function showPair(motion){
    const you = cardEl(cards[p.idx], 'you'), pile = cardEl(cards[p.idx + 1], 'pile');
    if (motion === 'slide'){
      const from = pileSlot.getBoundingClientRect(), to = youSlot.getBoundingClientRect();
      you.style.setProperty('--fx', Math.round(from.left - to.left) + 'px');
      you.style.setProperty('--fy', Math.round(from.top - to.top) + 'px');
      you.classList.add('slide');
    } else if (motion === 'deal') you.classList.add('deal');
    if (motion) pile.classList.add('deal');
    youSlot.replaceChildren(you); pileSlot.replaceChildren(pile);
    root.dataset.pair = String(p.idx);
    paintLeft();
  }
  function tick(){
    if (p.over) return;
    if (Date.now() - p.startedAt > TIME_LIMIT_MS){ finish(p.startedAt + TIME_LIMIT_MS, true); return; }
    showClock();
    p.raf = requestAnimationFrame(tick);
  }
  function pick(id, btn, where){
    if (p.locked || p.over) return;
    const now = Date.now();
    const common = cards[p.idx].ids.find(x => cards[p.idx + 1].ids.includes(x));
    if (id === common){
      p.locked = true; root.dataset.ready = '0';
      p.splits.push(now - p.startedAt - p.splits.reduce((sum, v) => sum + v, 0));
      root.querySelectorAll(`.sym[data-id="${id}"]`).forEach(s => { s.classList.remove('miss'); s.classList.add('hit'); });
      const last = p.idx === PAIRS - 1;
      setToast('good', last ? `${LABEL[id]}! That was the last pair` : `${LABEL[id]}! Next card`);
      blip('match'); buzz(30);
      if (last){ finish(now, false); return; }
      p.idx++; persist();
      later(() => {
        if (p.over) return;
        showPair('slide'); blip('deal');
        if (p.idx === PAIRS - 1) setToast('hint', 'Last card in the pile!');
        p.locked = false; root.dataset.ready = '1';
      }, HIT_MS);
    } else {
      if (now - p.lastMiss < 250) return;       // ignore an accidental double tap
      p.lastMiss = now; p.mistakes++; persist(); paintMisses(); showClock();
      restart(btn, 'miss'); restart(where === 'pile' ? pileSlot : youSlot, 'shake'); restart(pen, 'go');
      setToast('bad', `Not that one · +${PENALTY_MS / 1000} s`);
      blip('miss'); buzz([30, 60, 30]);
      later(() => btn.classList.remove('miss'), 450);
      later(() => { if (p.lastMiss === now && !p.locked) setToast('hint', 'Keep looking…'); }, 1000);
    }
  }
  function cleanup(){
    p.over = true; p.locked = true;
    cancelAnimationFrame(p.raf); clearInterval(p.countdown);
    p.timers.forEach(clearTimeout); p.timers = [];
    window.removeEventListener('beforeunload', warn);
    compact.removeEventListener('change', placeClock);
    if (state.stopPlay === cleanup) state.stopPlay = null;
  }
  function finish(now, dnf){
    cleanup();
    const result = { ...start(), finishedAt: now, mistakes: p.mistakes, splits: p.splits.slice() };
    if (dnf) result.dnf = true; else result.timeMs = now - p.startedAt + p.mistakes * PENALTY_MS;
    if (!dnf){ clock.textContent = (result.timeMs / 1000).toFixed(2); blip('done'); }
    delete state.local.prog[duel.id]; state.local.final[duel.id] = result; saveLocal();
    const token = state.shown = { duelId: duel.id, saving: true, failed: false };
    resend(duel.id).then(() => { token.saving = false; }, () => { token.saving = false; token.failed = true; })
      .then(() => { if (state.screen === 'result' && state.shown === token) render(); });
    setTimeout(() => { state.screen = 'result'; housekeeping(); render(); window.scrollTo(0, 0); }, dnf ? 0 : 800);
  }
  function leave(){ cleanup(); state.screen = 'lobby'; housekeeping(); render(); }
  function askLeave(){
    if (p.over) return;
    if (p.startedAt == null){ leave(); return; }
    sheet('Leave the duel?', h('p', { class:'soft', text:'The clock keeps running. You can pick this duel up again from the table until its 10 minutes are up.' }),
      [{ label:'Keep playing', cls:'primary' }, { label:'Leave', cls:'secondary', onclick: leave }]);
  }
  function go(){
    overlay.hidden = true; overlay.replaceChildren();
    if (p.startedAt == null){
      p.startedAt = Date.now(); persist();
      state.backend.saveResult(state.room, start()).catch(() => {});   // tells the scoreboard the clock is running
    }
    window.addEventListener('beforeunload', warn);
    showPair('deal'); blip('deal');
    p.locked = false; root.dataset.ready = '1';
    tick();
  }
  function countdown(){
    let n = 3;
    overlay.className = 'overlay center';
    const show = () => { overlay.replaceChildren(h('div', { class:'count', role:'status', text: String(n) })); blip('tick'); };
    show();
    p.countdown = setInterval(() => { n--; if (n > 0) show(); else { clearInterval(p.countdown); go(); } }, 700);
  }

  compact.addEventListener('change', placeClock);
  placeClock(); paintLeft(); paintMisses(); showClock();
  pileSlot.replaceChildren(cardEl(null, 'pile')); youSlot.replaceChildren(cardEl(null, 'you'));
  const resume = p.startedAt != null;
  overlay.append(h('div', { class:'sheet intro', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'intro-h' },
    h('h2', { id:'intro-h', text: resume ? `Duel #${no} is already running` : `Duel #${no}` }),
    resume ? h('p', { class:'soft', text:'You started it earlier and the clock never stopped. Jump back in.' })
      : h('ol', { class:'steps' },
          h('li', null, h('span', { class:'n', text:'1' }), h('span', { text:`${PAIRS} pairs of cards. Each pair shares exactly one picture.` })),
          h('li', null, h('span', { class:'n', text:'2' }), h('span', { text:'Tap it on either card. The pile card then becomes your card.' })),
          h('li', null, h('span', { class:'n', text:'3' }), h('span', { text:`A wrong tap adds ${PENALTY_MS / 1000} seconds. Once you start, the clock can’t be paused.` }))),
    h('div', { class:'pair-btns', style:'margin-top:22px' },
      h('button', { class:'btn secondary slim', type:'button', onclick: leave }, 'Back'),
      h('button', { class:'btn primary slim', type:'button', onclick: resume ? go : countdown }, resume ? 'Continue' : 'Start'))));
  const startBtn = overlay.querySelector('.btn.primary');
  if (startBtn) startBtn.focus();
}

for (const [id] of SYMBOLS){ const img = new Image(); img.src = symbolSrc(id); }   // so cards appear without a flicker
boot();
})();
</script>
