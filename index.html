/* Design tokens: docs/design/tokens.css, unchanged. */
:root{
  --felt:#1F3B31; --felt-dot:rgba(255,240,215,0.045); --panel:#2A4A3E; --panel-raised:#34584A; --line:#3E6152; --line-strong:#5E8172;
  --text:#FBF1DE; --text-soft:#C9D8CD; --text-muted:#B9CCBF; --placeholder:#9FB8A9;
  --card:#FFF8EC; --card-edge:#D8C29C; --card-stitch:#E8D6B4; --ink:#2A1D14;
  --honey:#F2B54A; --honey-edge:#B9822A; --honey-tint:rgba(242,181,74,0.16); --honey-on-tint:#F7C96F;
  --coral:#F09A84; --coral-tint:rgba(240,154,132,0.16); --coral-on-tint:#F8BFAE;
  --miss:#D9693F; --miss-toast:#EFA184; --ok:#B5DDBF; --ok-tint:rgba(127,168,138,0.2);
  --font-display:'Fredoka', system-ui, sans-serif; --font-body:'Nunito', system-ui, sans-serif;
  --fs-hero:52px; --fs-h1-result:46px; --fs-h1:24px; --fs-button:20px; --fs-body:17px; --fs-label:14px; --fs-small:13px; --fs-caption:12px;
  --radius-button:18px; --radius-panel:18px; --radius-panel-lg:24px; --radius-input:16px; --radius-chip:999px;
  --button-height:58px; --input-height:56px; --tap-min:44px;
  --shadow-card:0 6px 0 var(--card-edge), 0 16px 28px rgba(8,20,15,0.45);
  --shadow-tile:0 5px 0 var(--card-edge);
  --shadow-button:0 4px 0 var(--honey-edge);
  --ease-bounce:cubic-bezier(0.2,0.8,0.2,1.15); --ease-out:cubic-bezier(0.25,0.8,0.25,1);
  --dur-deal:420ms; --dur-slide:520ms; --dur-shake:380ms; --dur-toast:260ms; --dur-press:120ms;
}
@media (prefers-reduced-motion:reduce){ :root{ --dur-deal:1ms; --dur-slide:1ms; --dur-shake:1ms; --dur-toast:1ms; } }

/* ── base ── */
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; background-color:var(--felt); }
body{ margin:0; min-height:100vh; min-height:100dvh; color:var(--text); font:var(--fs-body)/1.45 var(--font-body);
  background-color:var(--felt); background-image:radial-gradient(var(--felt-dot) 1px, transparent 1.4px); background-size:7px 7px; }
button,input{ font:inherit; color:inherit; }
h1,h2,h3,p{ margin:0; }
img{ display:block; }
a{ color:var(--honey); } a:hover{ color:var(--honey-on-tint); }
:focus-visible{ outline:3px solid var(--honey); outline-offset:3px; }
.display{ font-family:var(--font-display); }
.label{ font-weight:800; font-size:var(--fs-label); letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
.caption{ font-weight:800; font-size:var(--fs-caption); letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); text-align:center; }
.soft{ color:var(--text-soft); } .muted{ color:var(--text-muted); } .small{ font-size:var(--fs-small); }
.ell{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* a phone-width column, centred on wider screens */
.col{ --pad:24px; width:100%; max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
  padding:max(20px, env(safe-area-inset-top)) var(--pad) max(30px, env(safe-area-inset-bottom)); }
@media (max-width:359px){ .col{ --pad:16px; } }
/* drawings that run to the screen edges, past the column's side padding */
.bleed{ display:block; width:calc(100% + 2 * var(--pad)); margin-left:calc(-1 * var(--pad)); margin-right:calc(-1 * var(--pad)); overflow:visible; }

/* ── buttons ── */
.btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:var(--button-height); padding:0 18px;
  border-radius:var(--radius-button); border:0; font-family:var(--font-display); font-weight:600; font-size:var(--fs-button); line-height:1.15;
  text-align:center; text-decoration:none; cursor:pointer; touch-action:manipulation; transition:transform var(--dur-press) ease, box-shadow var(--dur-press) ease; }
.btn svg{ flex:none; }
.btn.primary{ background:var(--honey); color:var(--ink); box-shadow:var(--shadow-button); }
.btn.primary:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--honey-edge); }
.btn.secondary{ background:transparent; border:2px solid var(--line-strong); color:var(--text); font-weight:500; }
.btn.secondary:active{ transform:translateY(3px); }
.btn.waiting,.btn:disabled{ background:transparent; border:2px dashed var(--line-strong); color:var(--text-muted); font-weight:500; font-size:18px;
  box-shadow:none; transform:none; cursor:default; }
.btn.slim{ min-height:52px; font-size:18px; }
.btn.small{ width:auto; min-height:46px; padding:0 18px; border-radius:14px; font-size:17px; flex:none; }
.btn.small.primary{ box-shadow:0 3px 0 var(--honey-edge); }
.btn-row{ display:flex; flex-direction:column; gap:12px; }
.pair-btns{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.ghost{ min-height:48px; border-radius:14px; border:2px solid var(--line-strong); background:transparent; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:15px; cursor:pointer; padding:0 10px; }
.ghost:active{ transform:translateY(2px); }
.icon-btn{ width:48px; height:48px; flex:none; border-radius:50%; border:0; background:var(--panel); color:var(--text);
  display:grid; place-items:center; cursor:pointer; padding:0; }
.icon-btn:active{ transform:translateY(2px); }
.link{ background:none; border:0; padding:0 4px; min-height:44px; color:var(--honey); font-weight:800; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; }

/* ── bars, chips, tokens ── */
.bar{ display:flex; align-items:center; gap:12px; min-height:48px; }
.bar h1{ flex:1; font-family:var(--font-display); font-weight:600; font-size:var(--fs-h1); }
@media (max-width:359px){ .bar .me-chip{ max-width:44%; } }
.me-chip{ display:flex; align-items:center; gap:10px; height:48px; max-width:min(62%, 220px); padding:0 16px 0 4px; border-radius:24px; border:0;
  background:var(--panel); color:var(--text); font-weight:700; font-size:15px; cursor:pointer; flex:none; min-width:0; }
.me-chip:active{ transform:translateY(2px); }
.token{ --ring:var(--honey); --t:40px; width:var(--t); height:var(--t); flex:none; border-radius:50%; background:var(--card);
  box-shadow:0 0 0 3px var(--ring); display:grid; place-items:center; }
.token img{ width:70%; height:70%; }
.token.them{ --ring:var(--coral); }
.token.big{ --t:46px; }
.tokens-stack{ display:flex; flex:none; padding-left:3px; }
.tokens-stack .token + .token{ margin-left:-12px; }
.chip{ display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:0 12px; border-radius:var(--radius-chip);
  font-weight:800; font-size:13px; white-space:nowrap; }
.chip.ok{ background:var(--ok-tint); color:var(--ok); }
.chip.you{ background:var(--honey-tint); color:var(--honey-on-tint); }
.chip.them{ background:var(--coral-tint); color:var(--coral-on-tint); }
.chip.panel{ background:var(--panel); color:var(--text); }
.winner{ display:inline-block; height:22px; padding:0 8px; border-radius:11px; font-family:var(--font-body); font-weight:800; font-size:11px;
  line-height:22px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink); background:var(--honey); flex:none; }
.winner.them{ background:var(--coral); }
.pill{ display:inline-flex; align-items:baseline; gap:5px; height:38px; padding:0 14px; border-radius:19px; line-height:38px;
  white-space:nowrap; flex:none; position:relative; font-variant-numeric:tabular-nums; }
.pill b{ font-family:var(--font-display); font-weight:600; font-size:22px; }
.pill small{ font-weight:800; font-size:12px; }
.pill.you{ background:var(--honey-tint); color:var(--honey); } .pill.you small{ color:var(--honey-on-tint); }
.pill.them{ background:var(--coral-tint); color:var(--coral); } .pill.them small{ color:var(--coral-on-tint); }

/* ── panels and rows ── */
.panel{ background:var(--panel); border-radius:var(--radius-panel-lg); padding:20px; }
.section{ display:flex; flex-direction:column; gap:10px; margin-top:24px; }
.rows{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.prow{ min-height:68px; padding:10px 14px; border-radius:var(--radius-panel); background:var(--panel); display:flex; align-items:center;
  gap:12px; flex-wrap:wrap; }
.prow.dashed{ background:transparent; border:2px dashed var(--line-strong); }
.prow .grow{ display:flex; flex-direction:column; flex:1; min-width:0; }
.prow .title{ font-family:var(--font-display); font-weight:600; font-size:18px; display:flex; align-items:center; gap:8px; min-width:0; }
.prow .sub{ font-size:var(--fs-small); color:var(--text-muted); }
.prow .wide{ flex-basis:100%; }
.prow .num{ font-family:var(--font-display); font-weight:600; font-size:22px; color:var(--honey); text-align:right; flex:none;
  font-variant-numeric:tabular-nums; }
.prow .num.them{ color:var(--coral); }
.prow .num small{ display:block; font-family:var(--font-body); font-weight:800; font-size:11px; letter-spacing:.5px; text-transform:uppercase;
  color:var(--honey-on-tint); line-height:1; }
.prow .num.them small{ color:var(--coral-on-tint); }
.empty{ color:var(--text-muted); font-size:15px; padding:2px 2px 0; }
.duel-disc{ width:46px; height:46px; flex:none; border-radius:50%; background:var(--card); color:var(--ink); box-shadow:0 3px 0 var(--card-edge);
  display:grid; place-items:center; font-family:var(--font-display); font-weight:600; font-size:19px; transform:rotate(-4deg); }
.times{ display:flex; flex-wrap:wrap; gap:6px; }
.wait-disc{ width:46px; height:46px; flex:none; border-radius:50%; border:2px dashed var(--line-strong); display:flex; align-items:center;
  justify-content:center; gap:4px; }
.wait-disc i{ width:6px; height:6px; border-radius:3px; background:var(--text-muted); animation:waitdot 1.4s infinite ease-in-out; }
.wait-disc i:nth-child(2){ animation-delay:.2s; } .wait-disc i:nth-child(3){ animation-delay:.4s; }
details.pairs summary{ cursor:pointer; color:var(--honey); font-weight:800; font-size:14px; min-height:36px; display:flex; align-items:center; }
.scroll-x{ overflow-x:auto; }

/* ── forms ── */
.field{ width:100%; height:var(--input-height); padding:0 18px; border-radius:var(--radius-input); border:2px solid var(--line);
  background:var(--panel); color:var(--text); font-weight:700; font-size:18px; }
.field::placeholder{ color:var(--placeholder); opacity:1; }
.field.link-field{ height:48px; font-weight:600; font-size:14px; color:var(--text-soft); background:var(--felt); }
.tokens{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
.tokens button{ height:102px; border-radius:18px; border:0; background:var(--panel); color:var(--text); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:14px; cursor:pointer; }
.tokens button[aria-pressed="true"]{ background:var(--panel-raised); box-shadow:0 0 0 3px var(--honey); }
.tokens .disc{ width:56px; height:56px; border-radius:50%; background:var(--card); display:grid; place-items:center; }
.tokens .disc img{ width:40px; height:40px; }
@media (max-width:359px){ .tokens button{ height:92px; } .tokens .disc{ width:48px; height:48px; } }
.known{ display:flex; flex-wrap:wrap; gap:8px; }
.known button{ display:flex; align-items:center; gap:8px; min-height:44px; max-width:100%; padding:0 14px 0 4px; border-radius:22px; border:0;
  background:var(--panel); color:var(--text); font-weight:700; font-size:15px; cursor:pointer; }
.known .token{ --t:32px; box-shadow:none; }

/* ── notes ── */
.note{ border:2px solid var(--line); border-radius:var(--radius-panel); padding:14px 16px; margin-top:16px; font-size:15px; color:var(--text-soft); }
.note b{ color:var(--text); }
.note.warn{ border-color:var(--coral); }
.note summary{ cursor:pointer; font-weight:800; color:var(--honey); margin-top:6px; min-height:44px; display:flex; align-items:center; }
.note ol{ margin:10px 0 0; padding-left:22px; } .note li{ margin-bottom:8px; }
code,pre{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.82rem; }
code{ background:var(--panel); padding:1px 5px; border-radius:5px; color:var(--text); overflow-wrap:anywhere; }
pre{ background:var(--felt); border:2px solid var(--line); padding:12px; border-radius:12px; overflow:auto; max-height:240px; margin:8px 0; color:var(--text-soft); }

/* ── tables ── */
table{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:15px; }
th,td{ text-align:right; padding:7px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
th{ font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); max-width:96px; overflow:hidden; text-overflow:ellipsis; }
th:first-child,td:first-child{ text-align:left; }
tr:last-child td{ border-bottom:0; }
td.best{ font-weight:800; color:var(--honey); } td.best.them{ color:var(--coral); }
td.total{ font-family:var(--font-display); font-weight:600; font-size:17px; }

/* ── welcome ── */
.hero-art{ max-height:42vh; margin-top:10px; }
.hero-art.small{ max-height:24vh; }
.table-row{ padding:0; gap:0; flex-wrap:nowrap; }
.table-link{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; min-height:68px; padding:10px 4px 10px 14px;
  color:var(--text); text-decoration:none; border-radius:var(--radius-panel); }
.table-link:hover{ color:var(--text); }
.table-link .chip{ flex:none; }
.table-row .forget{ width:44px; height:44px; margin-right:6px; background:transparent; color:var(--text-muted); }
.h-card{ fill:var(--card); } .h-edge{ fill:var(--card-edge); } .h-stitch{ fill:none; stroke:var(--card-stitch); stroke-width:2; stroke-dasharray:6 5; }
.h-ring{ fill:color-mix(in srgb, var(--honey) 24%, transparent); stroke:var(--honey); stroke-width:3; }
.h-sticker{ fill:var(--honey); } .h-sticker-edge{ fill:var(--honey-edge); }
.h-text{ fill:var(--ink); font-family:var(--font-display); font-weight:600; font-size:16px; }
.h-tok{ fill:var(--card); stroke-width:4; } .h-tok.you{ stroke:var(--honey); } .h-tok.them{ stroke:var(--coral); }
.wordmark{ font-family:var(--font-display); font-weight:600; font-size:var(--fs-hero); line-height:1; letter-spacing:-.5px; }
.tagline{ font-size:var(--fs-body); line-height:1.5; color:var(--text-soft); }

/* ── sheets and overlays ── */
.backdrop{ position:fixed; inset:0; z-index:40; background:rgba(8,20,15,.62); display:flex; align-items:flex-end; justify-content:center; }
.sheet{ width:100%; max-width:480px; max-height:92vh; max-height:92dvh; overflow:auto; background:var(--felt); border-top:2px solid var(--line);
  border-radius:var(--radius-panel-lg) var(--radius-panel-lg) 0 0; padding:24px 24px max(26px, env(safe-area-inset-bottom));
  box-shadow:0 -12px 32px rgba(8,20,15,.45); animation:sheetup var(--dur-toast) var(--ease-out); }
.sheet h2{ font-family:var(--font-display); font-weight:600; font-size:var(--fs-h1); margin-bottom:8px; }
.sheet .btn-row{ margin-top:22px; }
.steps{ list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:14px; }
.steps li{ display:flex; gap:14px; align-items:flex-start; color:var(--text-soft); }
.steps .n{ width:32px; height:32px; flex:none; border-radius:50%; background:var(--honey); color:var(--ink); display:grid; place-items:center;
  font-family:var(--font-display); font-weight:600; }
.mini{ display:block; width:100%; max-width:300px; margin:14px auto 0; }

/* ── duel screen ── */
.play{ --d:min(260px, calc(100vw - 40px), calc((100dvh - 334px) / 2)); position:relative; width:100%; max-width:480px; height:100vh; height:100dvh;
  margin:0 auto; padding:max(16px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom)); display:flex; flex-direction:column;
  overflow:hidden; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
.play-bar{ justify-content:space-between; flex:none; }
.play-mid{ flex:1; display:flex; justify-content:center; min-width:0; }
.play-title{ font-family:var(--font-display); font-weight:500; font-size:16px; color:var(--text-soft); }
.left-chip{ display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:20px; background:var(--panel);
  font-weight:800; font-size:15px; white-space:nowrap; flex:none; }
.friends{ margin-top:12px; flex:none; min-height:56px; padding:0 12px 0 8px; flex-wrap:nowrap; }
.friends .title{ font-size:17px; }
.play .me{ margin-top:auto; flex:none; min-height:56px; padding:0 12px 0 8px; flex-wrap:nowrap; }
.play .me .title{ font-size:17px; }
.stage{ display:flex; flex-direction:column; align-items:center; flex:none; }
.stage .caption{ margin-top:12px; }
.slot{ margin-top:8px; flex:none; }
.toastline{ height:44px; margin-top:12px; display:flex; align-items:center; justify-content:center; flex:none; max-width:100%; }
.toast{ display:flex; align-items:center; height:38px; padding:0 16px; border-radius:19px; border:2px solid transparent; font-weight:800;
  font-size:15px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.toast.hint{ background:var(--panel); border-color:var(--panel); color:var(--text-soft); }
.toast.good{ background:var(--honey); border-color:var(--honey); color:var(--ink); }
.toast.bad{ background:var(--miss-toast); border-color:var(--miss-toast); color:var(--ink); }
.pen{ position:absolute; right:4px; bottom:100%; margin-bottom:2px; color:var(--miss-toast); font-weight:800; font-size:15px; opacity:0; pointer-events:none; }
.pen.go{ animation:floatup .9s ease-out; }
.card{ position:relative; width:var(--d); height:var(--d); flex:none; border-radius:50%; background:var(--card); box-shadow:var(--shadow-card); }
.card::before{ content:''; position:absolute; inset:calc(var(--d) * .035); border:2px dashed var(--card-stitch); border-radius:50%; pointer-events:none; }
.card.blank{ opacity:.6; }
.card.slide{ z-index:3; }
.sym{ position:absolute; padding:0; border:0; border-radius:50%; background:transparent; cursor:pointer; -webkit-tap-highlight-color:transparent;

<body>
<div id="app"></div>
<noscript>Tobble needs JavaScript.</noscript>
<script>
(() => {
'use strict';

/* ─────────────────────────── 1. SETTINGS ───────────────────────────
   Shared scoreboard: paste your Supabase project URL and publishable key between
   the quotes, e.g.
     const SUPABASE_URL = 'https://abcdefghijklmnop.supabase.co';
     const SUPABASE_KEY = 'sb_publishable_...';
   While they are empty the game runs in demo mode and keeps scores only in this
   browser. The step-by-step guide is inside the game ("Set up the shared
   scoreboard"). The publishable key is meant to be public; never put the secret
   key here. */
const SUPABASE_URL = 'https://niqpwqsequxjjmzgijko.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OV3_04dRhjvoRfkX37ZBfA_XkksNCEm';
const POLL_MS = 10000;                 // how often an open game checks for the opponent's moves

const PAIRS = 10;                      // card pairs per duel
const PENALTY_MS = 3000;               // added for every wrong tap
const TIME_LIMIT_MS = 10 * 60 * 1000;  // a duel left unfinished this long counts as "out of time"
const PER_CARD = 8;                    // pictures per card
const TOKENS = ['robin', 'mushroom', 'acorn', 'moon', 'mitten', 'fish'];   // pictures players can pick next to their name

// The 26 pictures in assets/symbols, in the order of symbols.json: [file name, label].
const SYMBOLS = [
  ['acorn','Acorn'],['apple','Apple'],['bell','Bell'],['book','Book'],['candle','Candle'],['cherries','Cherries'],
  ['cloud','Cloud'],['cookie','Cookie'],['daisy','Daisy'],['feather','Feather'],['fish','Fish'],['heart','Heart'],
  ['house','House'],['key','Key'],['leaf','Leaf'],['mitten','Mitten'],['moon','Moon'],['mug','Mug'],
  ['mushroom','Mushroom'],['pine','Pine tree'],['pumpkin','Pumpkin'],['robin','Robin'],['snowflake','Snowflake'],
  ['sock','Sock'],['star','Star'],['umbrella','Umbrella'],
];
const LABEL = Object.fromEntries(SYMBOLS);
// Where the 8 pictures sit on a card: distance from the centre (r) and size (s) as fractions of the
// card's diameter, angle (a) in degrees. One picture in the middle and seven around, or three and five.
const LAYOUTS = [
  [{ r:0, a:0, s:.25 }, { r:.315, a:0, s:.2 }, { r:.315, a:51.43, s:.17 }, { r:.315, a:102.86, s:.21 },
   { r:.315, a:154.29, s:.18 }, { r:.315, a:205.71, s:.2 }, { r:.315, a:257.14, s:.17 }, { r:.315, a:308.57, s:.19 }],
  [{ r:.145, a:0, s:.19 }, { r:.145, a:120, s:.17 }, { r:.145, a:240, s:.2 }, { r:.335, a:36, s:.19 },
   { r:.335, a:108, s:.21 }, { r:.335, a:180, s:.17 }, { r:.335, a:252, s:.2 }, { r:.335, a:324, s:.18 }],
];

const SETUP_SQL = `-- Tobble: shared scoreboard. Run this once in the Supabase SQL Editor.
-- Everything it creates starts with "tobble_", so it is safe in an existing project,
-- and running it again does no harm.
--
-- The game never reads or writes the tables directly. It calls the three functions
-- below, which check every value and refuse to change a finished result.

create table if not exists public.tobble_duels (
  id         text primary key check (id ~ '^[a-z0-9]{8,24}$'),
  room       text not null check (room ~ '^[a-z0-9]{16,40}$'),
  seed       integer not null check (seed >= 0),
  created_by text not null check (char_length(created_by) between 1 and 40),
  created_at timestamptz not null default now()
);
create index if not exists tobble_duels_room on public.tobble_duels (room);

create table if not exists public.tobble_results (
  duel_id     text not null references public.tobble_duels (id) on delete cascade,
  player_key  text not null check (char_length(player_key) between 1 and 60),
  room        text not null,
  name        text not null check (char_length(name) between 1 and 40),
  started_at  bigint not null,
  finished_at bigint,
  time_ms     integer check (time_ms >= 0),
  mistakes    integer not null default 0 check (mistakes >= 0),
  splits      integer[] not null default '{}' check (cardinality(splits) <= 10),
  dnf         boolean not null default false,
  token       text check (token ~ '^[a-z]{2,12}$'),
  primary key (duel_id, player_key)
);
create index if not exists tobble_results_room on public.tobble_results (room);

-- Lock the tables: row level security with no policies, and no table rights for API users.
alter table public.tobble_duels enable row level security;
alter table public.tobble_results enable row level security;
revoke all on public.tobble_duels, public.tobble_results from anon, authenticated;

-- Everything stored for one game. A game is found only by its unguessable id.
create or replace function public.tobble_room(p_room text)
returns jsonb
language plpgsql stable security definer set search_path = ''
as $$
begin
  if p_room is null or p_room !~ '^[a-z0-9]{16,40}$' then
    raise exception 'Unknown game.';
  end if;
  return jsonb_build_object(
    'duels', coalesce((
      select jsonb_agg(jsonb_build_object(
               'id', d.id, 'seed', d.seed, 'createdBy', d.created_by,
               'createdAt', floor(extract(epoch from d.created_at) * 1000)::bigint)
             order by d.created_at, d.id)
      from public.tobble_duels d where d.room = p_room), '[]'::jsonb),
    'results', coalesce((
      select jsonb_agg(jsonb_build_object(
               'id', r.duel_id || '_' || r.player_key, 'duelId', r.duel_id,
               'key', r.player_key, 'name', r.name,
               'startedAt', r.started_at, 'finishedAt', r.finished_at, 'timeMs', r.time_ms,
               'mistakes', r.mistakes, 'splits', to_jsonb(r.splits), 'dnf', r.dnf, 'token', r.token))
      from public.tobble_results r where r.room = p_room), '[]'::jsonb));
end;
$$;

-- A new duel. Duels are never changed or deleted.
create or replace function public.tobble_new_duel(p_room text, p_id text, p_seed integer, p_created_by text)
returns void
language plpgsql security definer set search_path = ''
as $$
begin
  if p_room is null or p_room !~ '^[a-z0-9]{16,40}$' then
    raise exception 'Unknown game.';
  end if;
  if (select count(*) from public.tobble_duels d where d.room = p_room) >= 5000 then
    raise exception 'This game has reached its limit of 5000 duels.';
  end if;
  insert into public.tobble_duels (id, room, seed, created_by)
  values (p_id, p_room, p_seed, btrim(p_created_by))
  on conflict (id) do nothing;
  if not exists (select 1 from public.tobble_duels d where d.id = p_id and d.room = p_room) then
    raise exception 'That duel id is already in use.';
  end if;
end;
$$;

-- One player's result for one duel: stored when the clock starts, completed at the finish.
-- A result with a finish time is final.
create or replace function public.tobble_save_result(p_room text, p_result jsonb)
returns void
language plpgsql security definer set search_path = ''
as $$
declare
  v_duel     text := p_result ->> 'duelId';
  v_key      text := p_result ->> 'key';
  v_name     text := btrim(p_result ->> 'name');
  v_dnf      boolean := coalesce(p_result -> 'dnf' = 'true'::jsonb, false);
  v_token    text := nullif(p_result ->> 'token', '');
  v_started  bigint;
  v_finished bigint;
  v_time     integer;
  v_mistakes integer := 0;
  v_splits   integer[] := '{}';
  v_old      public.tobble_results;
begin
  if p_room is null or p_room !~ '^[a-z0-9]{16,40}$' then
    raise exception 'Unknown game.';
  end if;
  if jsonb_typeof(p_result) is distinct from 'object' then
    raise exception 'A result must be an object.';
  end if;
  if not exists (select 1 from public.tobble_duels d where d.id = v_duel and d.room = p_room) then
    raise exception 'Unknown duel.';
  end if;
  if jsonb_typeof(p_result -> 'startedAt') is distinct from 'number' then
    raise exception 'A result needs a start time.';
  end if;
  v_started := round((p_result ->> 'startedAt')::numeric);
  if jsonb_typeof(p_result -> 'finishedAt') = 'number' then
    v_finished := round((p_result ->> 'finishedAt')::numeric);
    if jsonb_typeof(p_result -> 'timeMs') = 'number' then
      v_time := round((p_result ->> 'timeMs')::numeric);
    end if;
    if v_time is null and not v_dnf then
      raise exception 'A finished result needs a time.';
    end if;
  end if;
  if jsonb_typeof(p_result -> 'mistakes') = 'number' then
    v_mistakes := round((p_result ->> 'mistakes')::numeric);
  end if;
  if jsonb_typeof(p_result -> 'splits') = 'array' then
    if jsonb_array_length(p_result -> 'splits') > 10
       or exists (select 1 from jsonb_array_elements(p_result -> 'splits') e where jsonb_typeof(e) <> 'number') then
      raise exception 'Splits must be at most 10 numbers.';
    end if;
    select coalesce(array_agg(round((e #>> '{}')::numeric)::integer order by n), '{}')
      into v_splits
      from jsonb_array_elements(p_result -> 'splits') with ordinality as t(e, n);
  end if;
  v_dnf := v_dnf and v_finished is not null;
  if v_token is not null and v_token !~ '^[a-z]{2,12}$' then
    raise exception 'Unknown token.';
  end if;

  select * into v_old from public.tobble_results r
   where r.duel_id = v_duel and r.player_key = v_key
   for update;
  if not found then
    if (select count(*) from public.tobble_results r where r.duel_id = v_duel) >= 10 then
      raise exception 'This duel already has 10 players.';
    end if;
    insert into public.tobble_results
      (duel_id, player_key, room, name, started_at, finished_at, time_ms, mistakes, splits, dnf, token)
    values (v_duel, v_key, p_room, v_name, v_started, v_finished, v_time, v_mistakes, v_splits, v_dnf, v_token);
  elsif v_old.finished_at is not null then
    if v_old.finished_at = v_finished and v_old.time_ms is not distinct from v_time then
      return;  -- the same final result sent twice
    end if;
    raise exception 'This result is already final.';
  elsif v_old.started_at <> v_started then
    raise exception 'The start time cannot change.';
  else
    update public.tobble_results
       set name = v_name, finished_at = v_finished, time_ms = v_time,
           mistakes = v_mistakes, splits = v_splits, dnf = v_dnf, token = coalesce(v_token, token)
     where duel_id = v_duel and player_key = v_key;
  end if;
end;
$$;

-- Only these three functions are reachable with the publishable key.
revoke all on function public.tobble_room(text) from public, anon, authenticated;
revoke all on function public.tobble_new_duel(text, text, integer, text) from public, anon, authenticated;
revoke all on function public.tobble_save_result(text, jsonb) from public, anon, authenticated;
grant execute on function public.tobble_room(text) to anon, authenticated;
grant execute on function public.tobble_new_duel(text, text, integer, text) to anon, authenticated;
grant execute on function public.tobble_save_result(text, jsonb) to anon, authenticated;

notify pgrst, 'reload schema';
`;

/* ─────────────────────────── 2. CARDS ─────────────────────────── */
// Small seeded random generator: the same seed gives both players the same duel.
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(list, rnd){
  for (let i = list.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}
// A card's look: one of the two layouts, turned by a random spin, each picture with its own tilt.
// x, y (offset from the centre) and size are fractions of the card's diameter.
function layoutCard(ids, rnd){
  const slots = LAYOUTS[rnd() < 0.5 ? 0 : 1], spin = Math.floor(rnd() * 360);
  const items = ids.map((id, i) => {
    const slot = slots[i], angle = (slot.a + spin) * Math.PI / 180;
    return { id, x: slot.r * Math.cos(angle), y: slot.r * Math.sin(angle), size: slot.s, tilt: Math.round(rnd() * 70 - 35) };
  });
  return { ids, items };
}
// A duel is a chain of PAIRS + 1 cards: pair k is card k with card k + 1, and they share exactly one picture.
// Card k + 1 keeps one picture of card k (never the previous answer) and takes the rest from pictures
// card k does not have. 26 pictures are plenty: a pair needs 2 x 8 - 1 = 15.
function buildDuel(seed){
  const rnd = mulberry32(seed >>> 0), all = SYMBOLS.map(s => s[0]), cards = [];
  for (let k = 0; k <= PAIRS; k++){
    let ids;
    if (k === 0) ids = shuffle(all.slice(), rnd).slice(0, PER_CARD);
    else {
      const prev = cards[k - 1].ids, older = k > 1 ? cards[k - 2].ids : [];
      const choices = prev.filter(id => !older.includes(id));
      const keep = choices[Math.floor(rnd() * choices.length)];
      ids = shuffle([keep, ...shuffle(all.filter(id => !prev.includes(id)), rnd).slice(0, PER_CARD - 1)], rnd);
    }
    cards.push(layoutCard(ids, rnd));
  }
  return cards;
}

/* ─────────────────────────── 3. HELPERS ─────────────────────────── */
const $app = document.getElementById('app');

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function fmt(ms){
  if (!Number.isFinite(ms)) return '—';
  const cs = Math.round(ms / 10), m = Math.floor(cs / 6000), s = (cs - m * 6000) / 100;
  return m ? `${m}:${s.toFixed(2).padStart(5, '0')}` : `${s.toFixed(2)} s`;
}
function fmtWhen(ts){
  try { return new Date(ts).toLocaleString(undefined, { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
  catch { return ''; }
}
function randomId(len){
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789', buf = new Uint32Array(len);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
  else for (let i = 0; i < len; i++) buf[i] = Math.floor(Math.random() * 4294967296);
  return Array.from(buf, v => abc[v % abc.length]).join('');
}
// The scoreboard recognises a player by this key, so "Vanda" and " vanda " are the same person.
function slug(name){
  const base = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  if (base) return base.slice(0, 40);
  return ('u' + Array.from(name.toLowerCase()).map(c => c.codePointAt(0).toString(16)).join('')).slice(0, 40);
}
function listNames(names){
  if (names.length <= 1) return names[0] || '';
  return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
}
// Browser storage can be missing (private windows, embedded previews): fall back to memory.
const mem = new Map();
const store = {
  get(k){ try { const v = localStorage.getItem(k); if (v != null) return v; } catch {} return mem.has(k) ? mem.get(k) : null; },
  set(k, v){ mem.set(k, v); try { localStorage.setItem(k, v); } catch {} },
};
const K = { name:'tobble:name', token:'tobble:token', sound:'tobble:sound', room:'tobble:room', tables:'tobble:tables', demo:'tobble:demo',
            local:(room, key) => `tobble:local:${room}:${key}` };

/* ─────────────────────────── 4. STORAGE BACKENDS ───────────────────────────
   Both keep two lists: duels {id, seed, createdAt, createdBy} and
   results {id, duelId, key, name, startedAt, finishedAt, timeMs, mistakes, splits, dnf}.
   subscribe() returns { stop(), now() }: now() asks for fresh data straight away. */
function localBackend(){
  const read = () => { try { const v = JSON.parse(store.get(K.demo)); if (v && v.duels && v.results) return v; } catch {} return { duels:[], results:[] }; };
  let data = read();
  const subs = new Set();
  const changed = () => { store.set(K.demo, JSON.stringify(data)); subs.forEach(f => f()); };
  window.addEventListener('storage', e => { if (e.key === K.demo){ data = read(); subs.forEach(f => f()); } });
  return {
    mode: 'local',
    subscribe(room, { onData }){
      const f = () => onData(data.duels.slice(), data.results.slice());
      subs.add(f); setTimeout(f, 0);
      return { stop: () => subs.delete(f), now: () => {} };
    },
    async createDuel(room, duel){ data.duels.push(duel); changed(); },
    async saveResult(room, result){
      const i = data.results.findIndex(r => r.id === result.id);
      if (i < 0) data.results.push(result);
      else if (data.results[i].finishedAt != null) throw Object.assign(new Error('This duel is already finished.'), { code: 'rejected' });
      else data.results[i] = result;
      changed();
    },
  };
}

// Supabase: the page only calls the three database functions from the setup SQL.
function supabaseBackend(url, key){
  const endpoint = url.replace(/\/+$/, '') + '/rest/v1/rpc/';
  const headers = { 'Content-Type': 'application/json', apikey: key };
  // A publishable key travels in the apikey header only; a legacy anon key (a JWT) also as a bearer token.
  if (/^eyJ/.test(key)) headers.Authorization = 'Bearer ' + key;
  async function call(fn, args){
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 10000);
    let res, text = '';
    try {
      res = await fetch(endpoint + fn, { method: 'POST', headers, body: JSON.stringify(args), cache: 'no-store', signal: ctrl.signal });
      text = await res.text();
    } catch {
      throw Object.assign(new Error('The scoreboard cannot be reached.'), { code: ctrl.signal.aborted ? 'timeout' : 'unavailable' });
    } finally { clearTimeout(timer); }
    if (!res.ok){
      let body = null; try { body = JSON.parse(text); } catch {}
      const code = res.status === 540 ? 'paused'
        : res.status === 404 ? 'not-set-up'
        : res.status === 401 || res.status === 403 ? 'permission-denied'
        : res.status === 402 ? 'restricted'
        : res.status >= 500 ? 'unavailable' : 'rejected';
      throw Object.assign(new Error((body && typeof body.message === 'string' && body.message) || 'HTTP ' + res.status), { code, status: res.status });
    }
    if (!text) return null;
    try { return JSON.parse(text); }
    catch { throw Object.assign(new Error('Unexpected answer from the scoreboard.'), { code: 'unavailable' }); }
  }
  return {
    mode: 'cloud',
    // Checks for news every POLL_MS while the page is visible and isActive() says so,
    // and straight away when the tab comes back or the connection returns.
    subscribe(room, { onData, onError, isActive }){
      let stopped = false, running = false, again = false, timer = 0;
      const tick = async () => {
        clearTimeout(timer);
        if (stopped) return;
        if (running){ again = true; return; }
        if (document.hidden || (isActive && !isActive())){ timer = setTimeout(tick, POLL_MS); return; }
        running = true; again = false;
        try {
          const data = await call('tobble_room', { p_room: room });
          if (!stopped) onData(Array.isArray(data && data.duels) ? data.duels : [], Array.isArray(data && data.results) ? data.results : []);
        } catch (e){ if (!stopped) onError(e); }
        finally {
          running = false;
          if (!stopped) timer = setTimeout(tick, again ? 0 : POLL_MS);
        }
      };
      const wake = () => { if (!document.hidden) tick(); };
      document.addEventListener('visibilitychange', wake);
      window.addEventListener('online', wake);
      tick();
      return {
        stop(){ stopped = true; clearTimeout(timer); document.removeEventListener('visibilitychange', wake); window.removeEventListener('online', wake); },
        now: tick,
      };
    },
    // One look at a table, without polling (the Welcome screen's list of tables).
    async load(room){
      const data = await call('tobble_room', { p_room: room });
      return { duels: Array.isArray(data && data.duels) ? data.duels : [], results: Array.isArray(data && data.results) ? data.results : [] };
    },
    createDuel(room, duel){
      return call('tobble_new_duel', { p_room: room, p_id: duel.id, p_seed: duel.seed, p_created_by: duel.createdBy });
    },
    saveResult(room, r){
      const result = { duelId: r.duelId, key: r.key, name: r.name, startedAt: r.startedAt };
      for (const k of ['finishedAt', 'timeMs', 'mistakes', 'splits', 'dnf', 'token']) if (r[k] != null) result[k] = r[k];
      return call('tobble_save_result', { p_room: room, p_result: result });
    },
  };
}

// Whatever comes back from storage is treated as untrusted data.
function cleanDuel(d){
  return { id: String(d.id), seed: Math.trunc(Number(d.seed) || 0), createdAt: Number(d.createdAt) || 0,
           createdBy: String(d.createdBy || '').slice(0, 40) };
}
function cleanResult(r){
  const finishedAt = r.finishedAt == null ? null : Number(r.finishedAt) || 0;
  const timeMs = Number.isFinite(r.timeMs) && r.timeMs >= 0 ? r.timeMs : null;
  return { id: String(r.id), duelId: String(r.duelId || ''), key: String(r.key || ''),
           name: String(r.name || 'Player').slice(0, 40), startedAt: Number(r.startedAt) || 0, finishedAt, timeMs,
           mistakes: Math.max(0, Math.trunc(Number(r.mistakes) || 0)),
           splits: Array.isArray(r.splits) ? r.splits.filter(Number.isFinite).slice(0, PAIRS) : [],
           dnf: finishedAt != null && (r.dnf === true || timeMs == null),
           token: TOKENS.includes(r.token) ? r.token : null };
}

/* ─────────────────────────── 5. APP STATE ─────────────────────────── */
const state = {
  backend: null, room: null, player: null, screen: 'boot', fatal: null,
  duels: [], results: [], sig: '', loaded: false, slow: false, error: null, feed: null,
  created: [],                      // duels started on this page, kept until the scoreboard lists them
  local: { prog: {}, final: {} },   // this player's unfinished duel and unsaved results, kept in the browser
  shown: null,                      // the result screen being shown
  stopPlay: null,                   // stops the duel on screen (clock, timers)
  pickToken: null,                  // selects a token on the name screen
  open: new Set(),                  // expanded "Pair by pair" panels
  saving: new Map(), sent: new Set(), refused: new Set(),
};
const isDone = r => r.finishedAt != null;
const isDemo = () => state.backend && state.backend.mode === 'local';

function syncLocal(){
  state.local = { prog: {}, final: {} };
  if (!state.room || !state.player) return;
  try {
    const v = JSON.parse(store.get(K.local(state.room, state.player.key)));
    if (v && v.prog && v.final) state.local = v;
  } catch {}
}
function saveLocal(){
  if (state.room && state.player) store.set(K.local(state.room, state.player.key), JSON.stringify(state.local));
}
// Stored results plus this player's finished-but-not-yet-saved ones.
function allResults(){
  const out = state.results.slice();
  for (const f of Object.values(state.local.final)){
    const i = out.findIndex(r => r.id === f.id);
    if (i < 0) out.push(cleanResult(f)); else if (!isDone(out[i])) out[i] = cleanResult(f);
  }

}
function winnersOf(done){
  const timed = done.filter(r => !r.dnf);
  if (done.length < 2 || !timed.length) return [];
  const best = Math.min(...timed.map(r => r.timeMs));
  return timed.filter(r => r.timeMs === best).map(r => r.key);
}
function summarize(){
  const me = state.player ? state.player.key : '';
  const duels = state.duels.slice().sort((a, b) => a.createdAt - b.createdAt || (a.id < b.id ? -1 : 1));
  const byDuel = new Map(duels.map(d => [d.id, []]));
  for (const r of allResults()){ const list = byDuel.get(r.duelId); if (list) list.push(r); }
  return duels.map((duel, i) => {
    const results = byDuel.get(duel.id);
    const mine = results.find(r => r.key === me) || null;
    const done = results.filter(isDone).sort((a, b) => (a.dnf - b.dnf) || (a.timeMs - b.timeMs));
    const othersDone = done.filter(r => r.key !== me);
    const status = !mine ? 'todo' : !isDone(mine) ? 'playing' : othersDone.length ? 'done' : 'waiting';
    return { duel, no: i + 1, mine, done, othersDone, status, winners: winnersOf(done) };
  });
}
// Only duels that at least two players have finished count, so both sides are compared on the same cards.
function leaderboard(rows){
  const players = new Map();
  for (const row of rows){
    if (row.done.length < 2) continue;
    for (const r of row.done){
      let p = players.get(r.key);
      if (!p){ p = { key: r.key, name: r.name, seen: 0, wins: 0, losses: 0, ties: 0, n: 0, sum: 0, best: null }; players.set(r.key, p); }
      if (r.finishedAt >= p.seen){ p.seen = r.finishedAt; p.name = r.name; }
      if (row.winners.includes(r.key)){ if (row.winners.length > 1) p.ties++; else p.wins++; } else p.losses++;
      if (!r.dnf){ p.n++; p.sum += r.timeMs; if (p.best == null || r.timeMs < p.best) p.best = r.timeMs; }
    }
  }
  const avg = p => p.n ? p.sum / p.n : Infinity;
  return [...players.values()].sort((a, b) => b.wins - a.wins || a.losses - b.losses || avg(a) - avg(b));
}
// Everyone else seen in this game: [{ key, name }].
function otherPlayerList(){
  const me = state.player ? state.player.key : '', names = new Map();
  for (const d of state.duels) if (d.createdBy) names.set(slug(d.createdBy), d.createdBy);
  for (const r of state.results) names.set(r.key, r.name);
  names.delete(me);

}
const otherPlayers = () => otherPlayerList().map(p => p.name);

// The tables this browser has sat at, newest first, for the Welcome screen. Kept in this browser only:
// [{ id, seen, duels, yourTurn, players: [{ name, token }] }], where yourTurn counts duels this player hasn't finished.
const MAX_TABLES = 12;
function cleanTable(t){
  return { id: String(t.id), seen: Number(t.seen) || 0,
           duels: Math.max(0, Math.trunc(Number(t.duels) || 0)), yourTurn: Math.max(0, Math.trunc(Number(t.yourTurn) || 0)),
           players: (Array.isArray(t.players) ? t.players : []).slice(0, 10)
             .map(x => ({ name: String((x && x.name) || 'Player').slice(0, 40), token: validToken(x && x.token) })) };
}
function readTables(){
  try {
    const v = JSON.parse(store.get(K.tables));
    if (Array.isArray(v)) return v.filter(t => t && /^[a-z0-9]{16,40}$/.test(t.id)).map(cleanTable).sort((a, b) => b.seen - a.seen);
  } catch {}
  return [];
}
// info: a tableInfo() result to store; visit: this table was just opened (moves it to the top).
function rememberTable(id, info, visit){
  const list = readTables(), before = JSON.stringify(list), i = list.findIndex(t => t.id === id);
  const entry = cleanTable({ ...(i >= 0 ? list[i] : { id }), ...(info || {}), ...(visit ? { seen: Date.now() } : {}) });
  if (i >= 0) list.splice(i, 1);
  list.push(entry);
  list.sort((a, b) => b.seen - a.seen);
  const after = JSON.stringify(list.slice(0, MAX_TABLES));
  if (after !== before) store.set(K.tables, after);
}
function forgetTable(id){ store.set(K.tables, JSON.stringify(readTables().filter(t => t.id !== id))); }
// A table seen from one player's seat: how many duels, how many they still have to finish, who else sits there.
function tableInfo(room, duels, results, me){
  const finished = new Set(results.filter(r => r.key === me.key && r.finishedAt != null).map(r => r.duelId));
  try { const v = JSON.parse(store.get(K.local(room, me.key))); if (v && v.final) Object.keys(v.final).forEach(id => finished.add(id)); } catch {}
  const people = new Map();
  for (const d of duels){
    const key = d.createdBy ? slug(d.createdBy) : '';
    if (key && key !== me.key && !people.has(key)) people.set(key, { name: d.createdBy, token: null, at: d.createdAt });
  }
  for (const r of results){
    if (r.key === me.key) continue;
    const at = r.finishedAt || r.startedAt, old = people.get(r.key);
    if (!old || at >= old.at) people.set(r.key, { name: r.name, token: r.token || (old && old.token) || null, at });
    else if (!old.token && r.token) old.token = r.token;
  }
  return { duels: duels.length, yourTurn: duels.filter(d => !finished.has(d.id)).length,
           players: [...people].sort((a, b) => b[1].at - a[1].at).map(([key, x]) => ({ name: x.name, token: x.token || defaultToken(key) })) };
}
// Fresh counts for the tables on the Welcome screen: one look at each of the newest few, at most every 15 seconds.
let tablesCheckedAt = 0;
function refreshTables(force){
  if (!state.backend || state.backend.mode !== 'cloud' || !state.player) return;
  if (!force && Date.now() - tablesCheckedAt < 15000) return;
  tablesCheckedAt = Date.now();
  const me = state.player, before = JSON.stringify(readTables());
  Promise.all(readTables().slice(0, 8).map(t => state.backend.load(t.id).then(({ duels, results }) => {
    rememberTable(t.id, tableInfo(t.id, duels.map(cleanDuel), results.map(cleanResult), me));
  }, () => {}))).then(() => {
    if (state.screen === 'landing' && state.player === me && JSON.stringify(readTables()) !== before) render();
  });
}

/* ─────────────────────────── 6. START-UP ─────────────────────────── */
function boot(){
  const url = String(SUPABASE_URL || '').trim(), key = String(SUPABASE_KEY || '').trim();
  if (url || key){
    // https:// for a hosted project; http://localhost or 127.0.0.1 for a local Supabase during development
    if (!/^(https:\/\/[^\s/]+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)(\/|$)/.test(url) || !key){
      state.fatal = 'The scoreboard settings are incomplete. SUPABASE_URL must be the project address starting with https:// and SUPABASE_KEY its publishable key.';
      render(); return;
    }
    state.backend = supabaseBackend(url, key);
  } else state.backend = localBackend();
  const name = store.get(K.name);
  if (name) state.player = { name, key: slug(name), token: validToken(store.get(K.token)) };
  const last = store.get(K.room);   // the one table remembered before the list of tables existed
  if (last && /^[a-z0-9]{16,40}$/.test(last) && !readTables().length) rememberTable(last);
  window.addEventListener('hashchange', enterRoom);
  enterRoom();
}
function enterRoom(){
  if (state.stopPlay) state.stopPlay();
  if (state.feed){ state.feed.stop(); state.feed = null; }
  Object.assign(state, { duels: [], results: [], sig: '', created: [], loaded: false, slow: false, error: null, shown: null });
  if (isDemo()) state.room = 'demo';
  else {
    const id = location.hash.replace(/^#/, '');
    state.room = /^[a-z0-9]{16,40}$/.test(id) ? id : null;
  }
  if (!state.room){ state.screen = 'landing'; render(); refreshTables(); return; }
  if (!isDemo()) rememberTable(state.room, null, true);
  syncLocal();
  state.screen = state.player ? 'lobby' : 'name';
  const room = state.room;
  setTimeout(() => { if (state.room === room && !state.loaded && !state.error){ state.slow = true; refresh(); } }, 10000);
  state.feed = state.backend.subscribe(room, {
    onData(duels, results){
      const d = duels.map(cleanDuel), r = results.map(cleanResult);
      for (const extra of state.created) if (!d.some(x => x.id === extra.id)) d.push(extra);
      const sig = JSON.stringify([d, r]);
      const changed = sig !== state.sig || !state.loaded || state.slow || !!state.error;
      Object.assign(state, { duels: d, results: r, sig, loaded: true, slow: false, error: null });
      housekeeping();
      if (!isDemo() && state.player) rememberTable(room, tableInfo(room, d, r, state.player));
      if (changed) refresh();             // redraw only when something changed
    },
    onError(err){
      const e = err && err.code ? err : { code: 'unknown' };
      const changed = !state.error || state.error.code !== e.code;
      state.error = e;
      if (changed) refresh();
    },
    isActive: () => state.screen !== 'play',   // no network traffic while a duel is being played
  });
  render();
}
function setPlayer(name, token){
  state.player = { name, key: slug(name), token: validToken(token) };
  store.set(K.name, name);
  if (state.player.token) store.set(K.token, state.player.token);
  syncLocal();
  state.screen = state.room ? 'lobby' : 'landing';
  housekeeping(); render();
  if (!state.room) refreshTables(true);
}
// Finish what an earlier visit left behind: re-send unsaved results, close duels that ran out of time.
function housekeeping(){
  if (!state.player || state.screen === 'play' || !state.loaded) return;
  const me = state.player;
  let dirty = false;
  for (const duel of state.duels){
    const id = duel.id + '_' + me.key;
    const stored = state.results.find(r => r.id === id);
    if (stored && isDone(stored)){
      if (state.local.final[duel.id] || state.local.prog[duel.id]){ delete state.local.final[duel.id]; delete state.local.prog[duel.id]; dirty = true; }
      continue;
    }
    if (state.local.final[duel.id]){
      if (!state.sent.has(duel.id) && !state.refused.has(duel.id)) resend(duel.id).catch(() => {});
      continue;
    }
    const prog = state.local.prog[duel.id];
    const startedAt = (prog && prog.startedAt) || (stored && stored.startedAt) || 0;
    if (startedAt && Date.now() - startedAt > TIME_LIMIT_MS){
      state.local.final[duel.id] = { id, duelId: duel.id, key: me.key, name: me.name, startedAt,
        finishedAt: startedAt + TIME_LIMIT_MS, mistakes: prog ? prog.mistakes : 0, splits: prog ? prog.splits : [], dnf: true, token: myToken() };
      delete state.local.prog[duel.id]; dirty = true;
      resend(duel.id).catch(() => {});
    }
  }
  if (dirty) saveLocal();
}
// Sends a finished result. The browser's copy is only dropped once the scoreboard lists it (see housekeeping),
// so a result is never lost to a dropped connection or a closed tab.
function resend(duelId){
  const final = state.local.final[duelId];
  if (!final) return Promise.resolve();
  if (state.saving.has(final.id)) return state.saving.get(final.id);
  const job = state.backend.saveResult(state.room, final)
    .then(() => { state.sent.add(duelId); state.refused.delete(duelId); if (state.feed) state.feed.now(); },
          e => { if (e && e.code === 'rejected') state.refused.add(duelId); throw e; })
    .finally(() => state.saving.delete(final.id));
  state.saving.set(final.id, job);
  return job;
}
const isUnsaved = duelId => !!state.local.final[duelId] && !state.sent.has(duelId);

// Sounds are tiny tones made on the spot (no audio files); vibration where the phone supports it.
const sound = { on: store.get(K.sound) !== 'off', ctx: null };

// A bottom sheet for questions and short guides. Escape or a tap outside closes it.
let closeOpenSheet = null;
function sheet(title, body, actions){
  if (closeOpenSheet) closeOpenSheet();
  const before = document.activeElement, id = 'sheet-' + randomId(6);
  const back = h('div', { class:'backdrop' });
  const close = () => {
    if (!back.isConnected) return;
    back.remove(); document.removeEventListener('keydown', onKey); closeOpenSheet = null;
    if (before && before.isConnected && before.focus) before.focus();
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  back.append(h('div', { class:'sheet', role:'dialog', 'aria-modal':'true', 'aria-labelledby': id },
    h('h2', { id, text: title }), body,
    h('div', { class:'btn-row' }, actions.map(a => h('button', { class:'btn ' + (a.cls || 'secondary'), type:'button',
      onclick: () => { close(); if (a.onclick) a.onclick(); } }, a.label)))));
  back.addEventListener('click', e => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  document.body.append(back);
  closeOpenSheet = close;
  const first = back.querySelector('.btn');
  if (first) first.focus();
  return close;
}

function render(){
  if (state.screen === 'play') return;          // the play screen draws itself
  $app.replaceChildren(view());
}
// Called when stored data changes: never rebuild a screen the player is typing or playing in.
function refresh(){
  if (state.screen === 'play') return;
  if (state.screen === 'name'){
    const box = document.getElementById('known'), note = document.getElementById('name-status');
    if (box) box.replaceChildren(...knownPlayers());
    if (note) note.replaceChildren(...(state.error ? [errorNote()] : []));
    return;
  }
  render();
}
function view(){
  if (state.fatal) return h('div', { class:'col' },
    h('div', { class:'bar' }, h('h1', { text:'Tobble' })),
    h('div', { class:'note warn', role:'alert' }, h('b', { text:'Settings problem. ' }), state.fatal),
    h('div', { style:'margin-top:auto;padding-top:24px' }, h('button', { class:'btn primary', type:'button', onclick: () => location.reload() }, 'Try again')));
  switch (state.screen){
    case 'landing': return landingView();

    case 'lobby': return lobbyView();
    case 'result': return resultView();
    default: return h('div', { class:'col' }, h('p', { class:'muted', text:'Loading…' }));
  }
}
function details(id, cls, label, ...body){
  const el = h('details', { class: cls, open: state.open.has(id) }, h('summary', { text: label }), body);
  el.addEventListener('toggle', () => { if (el.open) state.open.add(id); else state.open.delete(id); });
  return el;
}
function copyButton(label, getText, field){
  const btn = h('button', { class:'ghost', type:'button', style:'margin-top:4px' }, label);
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(getText()); btn.textContent = 'Copied!'; }
    catch {   // clipboard not available: select the text so it can be copied by hand
      if (field && field.select){ field.focus(); field.select(); }
      else if (field){ const range = document.createRange(); range.selectNodeContents(field); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); }
      btn.textContent = 'Selected, now copy';
    }
    setTimeout(() => { btn.textContent = label; }, 1600);
  });
  return btn;
}

/* Who's playing */
function knownPlayers(){
  const known = otherPlayerList();
  if (state.player) known.unshift({ key: state.player.key, name: state.player.name });
  const unique = [...new Map(known.map(p => [p.key, p])).values()];
  if (!unique.length) return [];
  return [h('div', { style:'display:flex;flex-direction:column;gap:10px;margin-top:24px' },
    h('span', { class:'label', text:'Already at this table' }),
    h('p', { class:'small muted', style:'margin-top:-4px', text:'Tap your name to carry on as that player.' }),
    h('div', { class:'known' }, unique.map(p => h('button', { type:'button', onclick: () => {
      const f = document.getElementById('name');
      f.value = p.name; f.dispatchEvent(new Event('input'));
      if (state.pickToken) state.pickToken(tokenOf(p.key));
      f.focus();
    } }, tokenEl(tokenOf(p.key)), h('span', { class:'ell', text: p.name })))))];
}
function nameView(){
  const me = state.player;
  let token = (me && validToken(me.token)) || validToken(store.get(K.token)) || TOKENS[Math.floor(Math.random() * TOKENS.length)];
  const clean = v => v.trim().replace(/\s+/g, ' ').slice(0, 24);
  const input = h('input', { class:'field', id:'name', type:'text', maxlength:'24', placeholder:'e.g. Ema',
    autocomplete:'nickname', spellcheck:'false', value: me ? me.name : '' });
  const tokenBtns = TOKENS.map(t => h('button', { type:'button', 'aria-pressed': String(t === token), onclick: () => pick(t) },
    h('span', { class:'disc' }, h('img', { src: symbolSrc(t), alt:'' })), LABEL[t]));
  const pick = t => { token = t; tokenBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(TOKENS[i] === t))); };
  state.pickToken = pick;
  const submit = h('button', { type:'submit' });
  const paint = () => {
    const ok = !!clean(input.value);
    submit.disabled = !ok;
    submit.className = 'btn ' + (ok ? 'primary' : 'waiting');
    submit.replaceChildren(...(ok ? ['Take a seat', icon('arrow')] : ['Type your name to sit down']));
  };
  input.addEventListener('input', paint);
  paint();
  const form = h('form', { style:'display:flex;flex-direction:column;flex:1' },
    h('div', { id:'known' }, knownPlayers()),
    h('div', { style:'display:flex;flex-direction:column;gap:8px;margin-top:24px' },
      h('label', { class:'label', for:'name', text:'Your name' }), input,
      h('p', { class:'small muted', text:'The scoreboard knows you by your name, so type it the same way on every phone.' })),
    h('div', { style:'display:flex;flex-direction:column;gap:12px;margin-top:24px' },
      h('span', { class:'label', id:'token-label', text:'Pick your token' }),
      h('div', { class:'tokens', role:'group', 'aria-labelledby':'token-label' }, tokenBtns)),
    h('div', { style:'margin-top:auto;padding-top:28px' }, submit));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = clean(input.value);
    if (!name){ input.focus(); return; }
    setPlayer(name, token);
  });
  const back = me ? () => { state.screen = state.room ? 'lobby' : 'landing'; render(); }
    : state.room && !isDemo() ? () => { location.hash = ''; } : null;
  return h('div', { class:'col' },
    h('div', { class:'bar' }, back && h('button', { class:'icon-btn', type:'button', 'aria-label':'Back', onclick: back }, icon('back')),
      h('h1', { text:'Who’s playing?' })),
    h('div', { id:'name-status' }, state.error && errorNote()),
    form);
}

/* The table */
function timeChip(r, row){
  const you = r.key === state.player.key, won = row.winners.includes(r.key);
  return h('span', { class:'chip ' + (you ? 'you' : 'them') }, won && icon('check', 14, 3),
    h('span', { class:'ell', style:'max-width:9em', text: you ? 'You' : r.name }), h('span', { text: r.dnf ? 'out of time' : fmt(r.timeMs) }));
}
function roundsTable(row){
  const me = state.player.key, players = row.done;
  const cell = (r, i) => {
    const v = r.splits[i];
    const fastest = players.length > 1 && Number.isFinite(v) && players.every(o => !Number.isFinite(o.splits[i]) || o.splits[i] >= v);
    return h('td', { class: fastest ? 'best' + (r.key === me ? '' : ' them') : '', text: Number.isFinite(v) ? (v / 1000).toFixed(2) : '—' });
  };
  return h('table', null,
    h('thead', null, h('tr', null, h('th', { text:'Pair' }), players.map(r => h('th', { title: r.name, text: r.key === me ? 'You' : r.name })))),
    h('tbody', null,
      Array.from({ length: PAIRS }, (_, i) => h('tr', null, h('td', { text: String(i + 1) }), players.map(r => cell(r, i)))),
      h('tr', null, h('td', { text:'Wrong taps' }), players.map(r => h('td', { text: r.mistakes ? `${r.mistakes} (+${r.mistakes * PENALTY_MS / 1000} s)` : '0' }))),
      h('tr', null, h('td', { text:'Total' }), players.map(r => h('td', { class:'total', text: r.dnf ? 'out of time' : fmt(r.timeMs) })))));
}
function duelItem(row){
  const d = row.duel, me = state.player.key;
  const by = d.createdBy ? (slug(d.createdBy) === me ? 'Dealt by you' : 'Dealt by ' + d.createdBy) : '';
  const head = [h('span', { class:'duel-disc', 'aria-hidden':'true', text: String(row.no) }),
    h('span', { class:'grow' }, h('span', { class:'title', text:`Duel #${row.no}` }),
      h('span', { class:'sub ell', text: [by, fmtWhen(d.createdAt)].filter(Boolean).join(' · ') }))];
  if (row.status === 'todo' || row.status === 'playing'){
    const names = row.othersDone.map(r => r.name);
    const line = row.status === 'playing' ? 'In progress. The clock is still running.'
      : names.length ? `${listNames(names)} already played. Their time stays hidden until you finish.` : 'Nobody has played it yet.';
    return h('li', { class:'duel mine prow' }, head,
      h('button', { class:'btn small primary', type:'button', onclick: () => openDuel(d.id) }, row.status === 'playing' ? 'Resume' : 'Play'),
      h('span', { class:'sub wide', text: line }));
  }
  if (row.status === 'waiting'){
    return h('li', { class:'duel prow' }, head,
      h('span', { class:'num' + (row.mine.dnf ? ' out' : ''), text: row.mine.dnf ? 'out of time' : fmt(row.mine.timeMs) }),
      h('span', { class:'sub wide', text: isUnsaved(d.id)
        ? 'Not saved to the scoreboard yet. It is sent again when the connection is back.' : 'Waiting for your friends to play it.' }));
  }
  const won = row.winners.includes(me), tie = row.winners.length > 1;
  const winner = row.done.find(r => row.winners.includes(r.key) && r.key !== me);
  const outcome = won ? (tie ? 'Tie' : 'You won') : winner ? `${winner.name} won` : 'You lost';
  return h('li', { class:'duel prow' }, head,
    h('span', { class:'chip ell ' + (won ? 'you' : 'them'), style:'max-width:45%', text: outcome }),
    h('div', { class:'times wide' }, row.done.map(r => timeChip(r, row))),
    h('div', { class:'wide' }, details('rounds:' + d.id, 'pairs', 'Pair by pair', h('div', { class:'scroll-x' }, roundsTable(row)))));
}
