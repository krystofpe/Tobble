<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snug Spot — Join a room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#F2B54A}a:hover{color:#F7C96F}
.felt{background-color:#1F3B31;background-image:radial-gradient(rgba(255,240,215,0.045) 1px, transparent 1.4px);background-size:7px 7px}
.press{transition:transform 120ms ease, box-shadow 120ms ease}
.press:active{transform:translateY(3px)}
a:focus-visible,button:focus-visible{outline:3px solid #F2B54A;outline-offset:3px}
input:focus{outline:3px solid #F2B54A;outline-offset:2px}
input::placeholder{color:#8FA99A}
</style>
</helmet>
<div class="felt" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 30px; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: Nunito, system-ui, sans-serif; color: #FBF1DE">

  <div style="display: flex; align-items: center; gap: 12px; height: 48px">
    <a href="Main.dc.html" aria-label="Back" class="press" style="width: 48px; height: 48px; border-radius: 50%; background: #2A4A3E; color: #FBF1DE; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px; color: #FBF1DE">Join a room</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 30px">
    <span id="codeLabel" style="font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #B9CCBF">Room code</span>
    <div role="group" aria-labelledby="codeLabel" style="display: flex; gap: 12px; justify-content: center">
      <sc-for list="{{codeSlots}}" as="slot" hint-placeholder-count="4">
        <input type="text" inputmode="text" autocomplete="off" maxlength="2" aria-label="{{slot.label}}" value="{{slot.v}}" onChange="{{slot.change}}" style="width: 66px; height: 78px; box-sizing: border-box; border: 0; border-radius: 16px; background: #FFF8EC; color: #2A1D14; text-align: center; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 38px; box-shadow: 0 5px 0 #D8C29C; text-transform: uppercase">
      </sc-for>
    </div>
    <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #C9D8CD; text-align: center">Ask your friend for the 4-letter code on their screen.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 28px">
    <label for="joinName" style="font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #B9CCBF">Your name</label>
    <input id="joinName" type="text" placeholder="e.g. Ema" value="{{name}}" onChange="{{setName}}" style="height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; border: 2px solid #3E6152; background: #2A4A3E; color: #FBF1DE; font-family: Nunito, sans-serif; font-weight: 700; font-size: 18px">
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 28px">
    <span style="font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #B9CCBF">Pick your token</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{tokens}}" as="t" hint-placeholder-count="6">
        <button type="button" class="press" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 102px; border-radius: 18px; border: 0; background: {{t.bg}}; box-shadow: {{t.ring}}; color: #FBF1DE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-family: Nunito, sans-serif; font-weight: 700; font-size: 14px">
          <span style="width: 56px; height: 56px; border-radius: 50%; background: #FFF8EC; display: flex; align-items: center; justify-content: center">
            <img src="{{t.src}}" alt="" style="width: 40px; height: 40px">
          </span>
          {{t.label}}
        </button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <a href="Lobby.dc.html" class="press" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; border-radius: 18px; background: #F2B54A; color: #2A1D14; text-decoration: none; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px; box-shadow: 0 4px 0 #B9822A">
        Join room {{codeText}}
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="width: 100%; height: 58px; border-radius: 18px; border: 2px dashed #5E8172; background: transparent; color: #B9CCBF; font-family: Fredoka, sans-serif; font-weight: 500; font-size: 18px">Enter all 4 letters to join</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TOKENS = [
  { id: 'robin', label: 'Robin', src: '../../assets/symbols/robin.svg' },
  { id: 'mushroom', label: 'Mushroom', src: '../../assets/symbols/mushroom.svg' },
  { id: 'acorn', label: 'Acorn', src: '../../assets/symbols/acorn.svg' },
  { id: 'moon', label: 'Moon', src: '../../assets/symbols/moon.svg' },
  { id: 'mitten', label: 'Mitten', src: '../../assets/symbols/mitten.svg' },
  { id: 'fish', label: 'Fish', src: '../../assets/symbols/fish.svg' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: ['M', 'O', 'S', 'S'], name: '', token: 'robin' };
  }
  renderVals() {
    const s = this.state;
    const codeSlots = s.code.map((v, i) => ({
      v: v,
      label: 'Room code, letter ' + (i + 1) + ' of 4',
      change: (e) => {
        const raw = (e.target.value || '').toUpperCase().replace(/[^A-Z]/g, '');
        const ch = raw.slice(-1);
        const code = this.state.code.slice();
        code[i] = ch;
        this.setState({ code: code });
        const next = e.target.nextElementSibling;
        if (ch && next && next.focus) next.focus();
      }
    }));
    const tokens = TOKENS.map((t) => {
      const on = t.id === s.token;
      return {
        label: t.label,
        src: t.src,
        pressed: on ? 'true' : 'false',
        bg: on ? '#34584A' : '#2A4A3E',
        ring: on ? '0 0 0 3px #F2B54A' : 'none',
        pick: () => this.setState({ token: t.id })
      };
    });
    const ready = s.code.every((c) => c && c.length === 1);
    return {
      codeSlots: codeSlots,
      tokens: tokens,
      name: s.name,
      setName: (e) => this.setState({ name: e.target.value }),
      ready: ready,
      notReady: !ready,
      codeText: s.code.join('')
    };
  }
}
</script>
</body>
</html>
